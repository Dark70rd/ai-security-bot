services:
  - type: web
    name: hades-sec-bot
    env: docker
    region: singapore
    plan: free
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: REPO_OWNER
        sync: false
      - key: REPO_NAME
        sync: false
      - key: WORKFLOW_FILE
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
