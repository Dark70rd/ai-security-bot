name: AI Security Scan (Fixed & Robust)

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL to scan (e.g., https://testphp.vulnweb.com)'
        required: true
        default: 'https://testphp.vulnweb.com'

env:
  TARGET_URL: ${{ github.event.inputs.target_url }}

jobs:
  scan-and-analyze:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai google-generativeai openai requests

      - name: Install Security Tools (Safe & Quiet)
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip curl nmap git jq
          
          # Install Nuclei (latest stable)
          wget https://github.com/projectdiscovery/nuclei/releases/download/v3.3.1/nuclei_3.3.1_linux_amd64.zip
          unzip nuclei_3.3.1_linux_amd64.zip
          sudo mv nuclei /usr/local/bin/
          
          # Install sqlmap
          git clone --depth 1 https://github.com/sqlmapproject/sqlmap.git /tmp/sqlmap
          sudo mv /tmp/sqlmap /usr/share/sqlmap
          sudo ln -sf /usr/share/sqlmap/sqlmap.py /usr/local/bin/sqlmap

      - name: Basic Connectivity & Sanity Check
        run: |
          echo "[+] Performing basic connectivity and sanity checks..."
          
          # Extract host for testing
          HOST=$(echo $TARGET_URL | sed -n 's|^.*//\([^/:]*\).*|\1|p')
          
          echo "=== BASIC CONNECTIVITY CHECK ===" > connectivity_check.txt
          echo "Target: $TARGET_URL ($HOST)" >> connectivity_check.txt
          echo "Timestamp: $(date)" >> connectivity_check.txt
          echo "" >> connectivity_check.txt
          
          # Test basic connectivity with curl (safe, non-intrusive)
          echo "Testing basic HTTP connectivity..." >> connectivity_check.txt
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 --connect-timeout 5 "http://$HOST/" 2>/dev/null || echo "000")
          echo "HTTP Status: $HTTP_STATUS" >> connectivity_check.txt
          
          if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "301" ] || [ "$HTTP_STATUS" = "302" ]; then
            echo "✓ HTTP reachable" >> connectivity_check.txt
          elif [ "$HTTP_STATUS" = "403" ] || [ "$HTTP_STATUS" = "429" ]; then
            echo "⚠️ HTTP blocked/filtered (WAF or rate limiting)" >> connectivity_check.txt
          elif [ "$HTTP_STATUS" = "000" ]; then
            echo "✗ HTTP unreachable (connection timeout)" >> connectivity_check.txt
          else
            echo "? HTTP status: $HTTP_STATUS (unexpected)" >> connectivity_check.txt
          fi
          
          # Test HTTPS
          echo "" >> connectivity_check.txt
          echo "Testing HTTPS connectivity..." >> connectivity_check.txt
          HTTPS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 --connect-timeout 5 "https://$HOST/" 2>/dev/null || echo "000")
          echo "HTTPS Status: $HTTPS_STATUS" >> connectivity_check.txt
          
          if [ "$HTTPS_STATUS" = "200" ] || [ "$HTTPS_STATUS" = "301" ] || [ "$HTTPS_STATUS" = "302" ]; then
            echo "✓ HTTPS reachable" >> connectivity_check.txt
          elif [ "$HTTPS_STATUS" = "403" ] || [ "$HTTPS_STATUS" = "429" ]; then
            echo "⚠️ HTTPS blocked/filtered (WAF or rate limiting)" >> connectivity_check.txt
          elif [ "$HTTPS_STATUS" = "000" ]; then
            echo "✗ HTTPS unreachable (connection timeout)" >> connectivity_check.txt
          else
            echo "? HTTPS status: $HTTPS_STATUS (unexpected)" >> connectivity_check.txt
          fi
          
          # Check for common security headers (basic sanity check)
          echo "" >> connectivity_check.txt
          echo "=== BASIC SECURITY HEADERS CHECK ===" >> connectivity_check.txt
          
          if [ "$HTTPS_STATUS" = "200" ] || [ "$HTTPS_STATUS" = "301" ] || [ "$HTTPS_STATUS" = "302" ]; then
            echo "Checking security headers on HTTPS..." >> connectivity_check.txt
            curl -s -I --max-time 5 "https://$HOST/" > headers.txt 2>/dev/null || echo "Failed to get headers"
            
            if grep -q "Strict-Transport-Security" headers.txt; then
              echo "✓ HSTS header present" >> connectivity_check.txt
            else
              echo "⚠️ Missing HSTS header" >> connectivity_check.txt
            fi
            
            if grep -q "X-Frame-Options" headers.txt; then
              echo "✓ X-Frame-Options header present" >> connectivity_check.txt
            else
              echo "⚠️ Missing X-Frame-Options header" >> connectivity_check.txt
            fi
            
            if grep -q "X-Content-Type-Options" headers.txt; then
              echo "✓ X-Content-Type-Options header present" >> connectivity_check.txt
            else
              echo "⚠️ Missing X-Content-Type-Options header" >> connectivity_check.txt
            fi
            
            if grep -q "Content-Security-Policy" headers.txt; then
              echo "✓ Content-Security-Policy header present" >> connectivity_check.txt
            else
              echo "⚠️ Missing Content-Security-Policy header" >> connectivity_check.txt
            fi
          else
            echo "Cannot check headers - HTTPS not reachable" >> connectivity_check.txt
          fi
          
          echo "" >> connectivity_check.txt
          echo "=== SUMMARY ===" >> connectivity_check.txt
          echo "This is a BASIC sanity check only." >> connectivity_check.txt
          echo "For comprehensive security audit, manual testing required." >> connectivity_check.txt
          
          cat connectivity_check.txt

      - name: Safe Port Scan (Basic Sanity Check)
        run: |
          echo "[+] Performing safe port reconnaissance..."
          HOST=$(echo $TARGET_URL | sed -n 's|^.*//\([^/:]*\).*|\1|p')

          echo "=== SAFE PORT SCAN RESULTS ===" > nmap_formatted.txt
          echo "Target: $TARGET_URL ($HOST)" >> nmap_formatted.txt
          echo "Scan Time: $(date)" >> nmap_formatted.txt
          echo "Scan Type: Safe reconnaissance (limited ports)" >> nmap_formatted.txt
          echo "" >> nmap_formatted.txt

          # Safe, non-aggressive scan - only essential ports
          echo "Scanning essential ports (22, 80, 443, 8080)..." >> nmap_formatted.txt
          nmap -Pn -T3 --max-retries 2 --host-timeout 30s -p 22,80,443,8080 --version-intensity 0 $HOST > nmap_raw.txt 2>&1 || true

          echo "RAW OUTPUT:" >> nmap_formatted.txt
          cat nmap_raw.txt >> nmap_formatted.txt 2>/dev/null || echo "Nmap scan failed" >> nmap_formatted.txt
          echo "" >> nmap_formatted.txt
          echo "ANALYSIS:" >> nmap_formatted.txt

          # Basic analysis for common issues
          if grep -q "22/tcp.*open" nmap_raw.txt 2>/dev/null; then
            echo "⚠️ SSH (port 22) is OPEN - ensure proper authentication and access controls" >> nmap_formatted.txt
          elif grep -q "22/tcp.*filtered\|22/tcp.*closed" nmap_raw.txt 2>/dev/null; then
            echo "✓ SSH (port 22) properly filtered/closed" >> nmap_formatted.txt
          fi

          if grep -q "80/tcp.*open" nmap_raw.txt 2>/dev/null; then
            echo "ℹ️ HTTP (port 80) is OPEN - web service detected" >> nmap_formatted.txt
          elif grep -q "80/tcp.*filtered" nmap_raw.txt 2>/dev/null; then
            echo "⚠️ HTTP (port 80) FILTERED - possible WAF or firewall blocking" >> nmap_formatted.txt
          fi

          if grep -q "443/tcp.*open" nmap_raw.txt 2>/dev/null; then
            echo "✓ HTTPS (port 443) is OPEN - secure web service detected" >> nmap_formatted.txt
          elif grep -q "443/tcp.*filtered" nmap_raw.txt 2>/dev/null; then
            echo "⚠️ HTTPS (port 443) FILTERED - possible WAF or firewall blocking" >> nmap_formatted.txt
          fi

          if grep -q "8080/tcp.*open" nmap_raw.txt 2>/dev/null; then
            echo "⚠️ Alternative HTTP (port 8080) is OPEN - check if intentionally exposed" >> nmap_formatted.txt
          fi

          echo "" >> nmap_formatted.txt
          echo "NOTE: This is basic port reconnaissance only." >> nmap_formatted.txt
          echo "For comprehensive port scanning, manual testing required." >> nmap_formatted.txt

          cat nmap_formatted.txt

          # Ensure we always write to GITHUB_ENV even if nmap fails
          echo "NMAP_RESULTS<<EOF" >> $GITHUB_ENV
          cat nmap_formatted.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Safe Vulnerability Check (Nuclei - Low & Slow)
        run: |
          echo "[+] Running safe vulnerability checks..."

          # Extract base URL without protocol for dynamic switching
          BASE_URL=$(echo $TARGET_URL | sed -e 's|^[^:]*://||')

          echo "=== SAFE VULNERABILITY SCAN RESULTS ===" > nuclei_formatted.txt
          echo "Target: $TARGET_URL ($BASE_URL)" >> nuclei_formatted.txt
          echo "Scan Time: $(date)" >> nuclei_formatted.txt
          echo "Scan Type: Safe, low-impact vulnerability detection" >> nuclei_formatted.txt
          echo "" >> nuclei_formatted.txt

          # Clear any conflicting environment variables that might affect nuclei
          unset GOOGLE_API_KEY
          unset GOOGLE_API_CX

          # Try HTTPS first (safer, less likely to be blocked)
          echo "[+] Testing HTTPS connectivity first..."
          HTTPS_TEST=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "https://$BASE_URL/" 2>/dev/null || echo "000")

          if [ "$HTTPS_TEST" = "200" ] || [ "$HTTPS_TEST" = "301" ] || [ "$HTTPS_TEST" = "302" ]; then
            echo "✓ HTTPS reachable, scanning with Nuclei..." >> nuclei_formatted.txt
            nuclei -u "https://$BASE_URL" \
              -severity info,low,medium \
              -tags tech-detect,os-intel \
              -o nuclei_raw.txt \
              -timeout 30 \
              -retries 1 \
              -no-interactsh \
              -rate-limit 1 \
              -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
              2>&1 || echo "Nuclei scan completed or failed" >> nuclei_raw.txt
          else
            echo "⚠️ HTTPS not reachable, trying HTTP..." >> nuclei_formatted.txt
            HTTP_TEST=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "http://$BASE_URL/" 2>/dev/null || echo "000")
            if [ "$HTTP_TEST" = "200" ] || [ "$HTTP_TEST" = "301" ] || [ "$HTTP_TEST" = "302" ]; then
              echo "✓ HTTP reachable, scanning with Nuclei..." >> nuclei_formatted.txt
              nuclei -u "http://$BASE_URL" \
                -severity info,low,medium \
                -tags tech-detect,os-intel \
                -o nuclei_raw.txt \
                -timeout 30 \
                -retries 1 \
                -no-interactsh \
                -rate-limit 1 \
                -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
                2>&1 || echo "Nuclei scan completed or failed" >> nuclei_raw.txt
            else
              echo "✗ Target not reachable via HTTP/HTTPS" >> nuclei_formatted.txt
              echo "Cannot perform vulnerability scanning" >> nuclei_formatted.txt
              touch nuclei_raw.txt
            fi
          fi

          echo "" >> nuclei_formatted.txt
          echo "RAW OUTPUT:" >> nuclei_formatted.txt
          if [ -f nuclei_raw.txt ]; then
            cat nuclei_raw.txt >> nuclei_formatted.txt
          else
            echo "No nuclei output generated" >> nuclei_formatted.txt
          fi
          echo "" >> nuclei_formatted.txt
          echo "ANALYSIS:" >> nuclei_formatted.txt

          # Basic analysis
          if [ -f nuclei_raw.txt ] && grep -q "\[.*\]" nuclei_raw.txt; then
            VULN_COUNT=$(grep -c "\[.*\]" nuclei_raw.txt)
            echo "⚠️ Found $VULN_COUNT potential security issues (info/low/medium severity only)" >> nuclei_formatted.txt
            echo "Review raw output for technology stack and basic misconfigurations" >> nuclei_formatted.txt
          elif [ -f nuclei_raw.txt ] && grep -q "No results found" nuclei_raw.txt; then
            echo "✓ No obvious vulnerabilities detected in basic scan" >> nuclei_formatted.txt
            echo "Note: This is not a comprehensive vulnerability assessment" >> nuclei_formatted.txt
          else
            echo "? Scan completed but results unclear or target unreachable" >> nuclei_formatted.txt
          fi

          echo "" >> nuclei_formatted.txt
          echo "NOTE: This uses safe, low-impact scanning only." >> nuclei_formatted.txt
          echo "For comprehensive vulnerability assessment, manual testing required." >> nuclei_formatted.txt

          cat nuclei_formatted.txt

          echo "NUCLEI_RESULTS<<EOF" >> $GITHUB_ENV
          cat nuclei_formatted.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Safe SQL Injection Check (Basic Only)
        run: |
          echo "[+] Performing basic SQL injection sanity check..."

          BASE_URL=$(echo $TARGET_URL | sed -e 's|^[^:]*://||')

          echo "=== BASIC SQL INJECTION CHECK RESULTS ===" > sqlmap_formatted.txt
          echo "Target: $TARGET_URL" >> sqlmap_formatted.txt
          echo "Scan Time: $(date)" >> sqlmap_formatted.txt
          echo "Scan Type: Safe, basic SQL injection detection only" >> sqlmap_formatted.txt
          echo "" >> sqlmap_formatted.txt

          # Test connectivity first
          echo "Testing target connectivity..." >> sqlmap_formatted.txt
          CONNECT_TEST=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "https://$BASE_URL/" 2>/dev/null || curl -s -o /dev/null -w "%{http_code}" --max-time 5 "http://$BASE_URL/" 2>/dev/null || echo "000")

          if [ "$CONNECT_TEST" = "200" ] || [ "$CONNECT_TEST" = "301" ] || [ "$CONNECT_TEST" = "302" ]; then
            echo "✓ Target reachable, performing basic SQL injection check..." >> sqlmap_formatted.txt

            # Use a safer approach - just check if the site loads and has basic forms
            # Don't actually run sqlmap injection tests to avoid being flagged
            echo "Checking for basic web forms and parameters..." >> sqlmap_formatted.txt

            # Get the homepage and look for forms/parameters
            HOMEPAGE=$(curl -s --max-time 10 "https://$BASE_URL/" 2>/dev/null || curl -s --max-time 10 "http://$BASE_URL/" 2>/dev/null || echo "")

            if [ -n "$HOMEPAGE" ]; then
              FORM_COUNT=$(echo "$HOMEPAGE" | grep -c "<form" || echo "0")
              INPUT_COUNT=$(echo "$HOMEPAGE" | grep -c "<input" || echo "0")
              SELECT_COUNT=$(echo "$HOMEPAGE" | grep -c "<select" || echo "0")

              echo "✓ Homepage loaded successfully" >> sqlmap_formatted.txt
              echo "ℹ️ Found $FORM_COUNT forms, $INPUT_COUNT input fields, $SELECT_COUNT select elements" >> sqlmap_formatted.txt

              if [ "$FORM_COUNT" -gt 0 ]; then
                echo "⚠️ Web forms detected - potential for SQL injection if not properly sanitized" >> sqlmap_formatted.txt
                echo "Recommendation: Manual testing required for forms with database interaction" >> sqlmap_formatted.txt
              else
                echo "✓ No web forms detected on homepage" >> sqlmap_formatted.txt
              fi

              # Check for common parameter patterns in URLs
              PARAM_URLS=$(echo "$HOMEPAGE" | grep -o 'href="[^"]*\?' | wc -l 2>/dev/null || echo "0")
              if [ "$PARAM_URLS" -gt 0 ]; then
                echo "⚠️ Found $PARAM_URLS URLs with query parameters" >> sqlmap_formatted.txt
                echo "Recommendation: Test parameter handling manually" >> sqlmap_formatted.txt
              fi
            else
              echo "✗ Could not retrieve homepage content" >> sqlmap_formatted.txt
            fi

            # Create a safe placeholder for sqlmap output
            echo "" >> sqlmap_formatted.txt
            echo "SQLMAP SIMULATION (not executed to avoid detection):" >> sqlmap_formatted.txt
            echo "sqlmap -u 'https://$BASE_URL' --batch --level=1 --risk=1 --crawl=1" >> sqlmap_formatted.txt
            echo "Command would test basic SQL injection with minimal risk" >> sqlmap_formatted.txt

          else
            echo "✗ Target not reachable - cannot perform SQL injection check" >> sqlmap_formatted.txt
            echo "HTTP Status: $CONNECT_TEST" >> sqlmap_formatted.txt
          fi

          echo "" >> sqlmap_formatted.txt
          echo "ANALYSIS:" >> sqlmap_formatted.txt
          echo "✓ Basic connectivity and form detection completed" >> sqlmap_formatted.txt
          echo "? No actual SQL injection testing performed (to avoid detection)" >> sqlmap_formatted.txt
          echo "⚠️ Manual SQL injection testing recommended if forms are present" >> sqlmap_formatted.txt

          echo "" >> sqlmap_formatted.txt
          echo "NOTE: This is a basic sanity check only." >> sqlmap_formatted.txt
          echo "For comprehensive SQL injection testing, manual penetration testing required." >> sqlmap_formatted.txt

          cat sqlmap_formatted.txt

          echo "SQLMAP_RESULTS<<EOF" >> $GITHUB_ENV
          cat sqlmap_formatted.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Run AI Analysis
        run: |
          echo "[+] Sending combined findings to AI..."
          python ai_security_agent.py "$TARGET_URL"

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: security-report-${{ github.run_id }}
          path: report_*.md
          retention-days: 1