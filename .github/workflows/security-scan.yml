name: AI Security Scan (Fixed & Robust)

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL to scan (e.g., https://testphp.vulnweb.com)'
        required: true
        default: 'https://testphp.vulnweb.com'

env:
  TARGET_URL: ${{ github.event.inputs.target_url }}
  GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
  # Suppress Node.js 20 deprecation warning
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan-and-analyze:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai

      - name: Install Security Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip curl nmap git
          
          # Install Nuclei (v3.3.1)
          wget https://github.com/projectdiscovery/nuclei/releases/download/v3.3.1/nuclei_3.3.1_linux_amd64.zip
          unzip nuclei_3.3.1_linux_amd64.zip
          sudo mv nuclei /usr/local/bin/
          
          # Install sqlmap
          git clone --depth 1 https://github.com/sqlmapproject/sqlmap.git /tmp/sqlmap
          sudo mv /tmp/sqlmap /usr/share/sqlmap
          sudo ln -sf /usr/share/sqlmap/sqlmap.py /usr/local/bin/sqlmap

      - name: Run Nmap Port Scan (Robust)
        run: |
          echo "[+] Running Fast Nmap on $TARGET_URL..."
          HOST=$(echo $TARGET_URL | sed -n 's|^.*//\([^/:]*\).*|\1|p')
          echo "Target Host: $HOST"
          
          # -Pn: Skip ping (firewalls often block ICMP)
          # -T4: Aggressive timing
          # -p 80,443: Only web ports
          # --version-intensity 1: Fast service detection
          nmap -Pn -T4 -p 80,443 --version-intensity 1 $HOST > nmap_results.txt 2>&1 || true
          
          echo "--- Nmap Results ---"
          cat nmap_results.txt
          echo "-------------------"
          
          # Ensure we always write to GITHUB_ENV even if nmap fails
          echo "NMAP_RESULTS<<EOF" >> $GITHUB_ENV
          cat nmap_results.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Run Nuclei Scan (Fixed Connectivity & Headers)
        run: |
          echo "[+] Running Nuclei with connectivity fixes..."
          
          # Extract base URL without protocol for dynamic switching
          BASE_URL=$(echo $TARGET_URL | sed -e 's|^[^:]*://||')
          
          # Try HTTP first (often less blocked than HTTPS on test sites)
          echo "[+] Attempting scan via HTTP..."
          nuclei -u "http://${BASE_URL}" \
            -severity critical,high,medium \
            -tags vuln,tech-detect \
            -o nuclei_results.txt \
            -timeout 60 \
            -retries 2 \
            -no-interactsh \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            2>&1 || true
          
          # Check if we got results. If empty or "No results", try HTTPS
          if [ ! -s nuclei_results.txt ] || grep -q "No results found" nuclei_results.txt; then
             echo "[+] HTTP scan empty or failed, trying HTTPS..."
             nuclei -u "https://${BASE_URL}" \
               -severity critical,high,medium \
               -tags vuln,tech-detect \
               -o nuclei_results.txt \
               -timeout 60 \
               -retries 2 \
               -no-interactsh \
               -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
               2>&1 || true
          fi
          
          # Ensure file exists
          if [ ! -f nuclei_results.txt ]; then 
            echo "No Nuclei results file created. Creating empty placeholder."
            touch nuclei_results.txt
          fi
          
          echo "--- Nuclei Results ---"
          cat nuclei_results.txt
          echo "----------------------"
          
          echo "NUCLEI_RESULTS<<EOF" >> $GITHUB_ENV
          cat nuclei_results.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Run SQLMap Scan (Fixed Connectivity & Random Agent)
        run: |
          echo "[+] Running SQLMap with connectivity fixes..."
          
          BASE_URL=$(echo $TARGET_URL | sed -e 's|^[^:]*://||')
          SQLMAP_OUTPUT="/tmp/sqlmap_raw_output.txt"
          
          # Try HTTP first
          echo "[+] Attempting SQLMap via HTTP..."
          timeout 300 sqlmap -u "http://${BASE_URL}" \
            --batch \
            --level=2 \
            --risk=1 \
            --crawl=1 \
            --timeout=20 \
            --random-agent \
            --delay=2 \
            --output-dir=/tmp/sqlmap_output \
            > "$SQLMAP_OUTPUT" 2>&1 || true
          
          # Check if we got meaningful output (looking for "testing parameters" or similar)
          if ! grep -q "testing parameters\|injectable\|GET parameter" "$SQLMAP_OUTPUT" 2>/dev/null; then
             echo "[+] HTTP scan failed or found nothing, trying HTTPS..."
             timeout 300 sqlmap -u "https://${BASE_URL}" \
               --batch \
               --level=2 \
               --risk=1 \
               --crawl=1 \
               --timeout=20 \
               --random-agent \
               --delay=2 \
               --output-dir=/tmp/sqlmap_output \
               > "$SQLMAP_OUTPUT" 2>&1 || true
          fi
          
          # Ensure we always write to GITHUB_ENV
          if [ -s "$SQLMAP_OUTPUT" ]; then
            echo "--- SQLMap Results ---"
            cat "$SQLMAP_OUTPUT"
            echo "----------------------"
            
            echo "SQLMAP_RESULTS<<EOF" >> $GITHUB_ENV
            cat "$SQLMAP_OUTPUT" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          else
            echo "No SQLMap results found or scan timed out."
            echo "SQLMAP_RESULTS<<EOF" >> $GITHUB_ENV
            echo "Scan failed to connect or produced no output." >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          fi

      - name: Run AI Analysis
        run: |
          echo "[+] Sending combined findings to AI..."
          python ai_security_agent.py "$TARGET_URL"

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: security-report-${{ github.run_id }}
          path: report_*.md
          retention-days: 1