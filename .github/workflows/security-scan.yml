name: AI Security Scan (Optimized)

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL to scan'
        required: true
        default: 'https://testphp.vulnweb.com'

env:
  TARGET_URL: ${{ github.event.inputs.target_url }}
  GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

jobs:
  scan-and-analyze:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai

      - name: Install Security Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip curl nmap git
          
          # Install Nuclei
          wget https://github.com/projectdiscovery/nuclei/releases/download/v3.3.1/nuclei_3.3.1_linux_amd64.zip
          unzip nuclei_3.3.1_linux_amd64.zip
          sudo mv nuclei /usr/local/bin/
          
          # Install sqlmap
          git clone --depth 1 https://github.com/sqlmapproject/sqlmap.git /tmp/sqlmap
          sudo mv /tmp/sqlmap /usr/share/sqlmap
          sudo ln -sf /usr/share/sqlmap/sqlmap.py /usr/local/bin/sqlmap

      - name: Run Nmap Port Scan (Fast)
        run: |
          echo "[+] Running Fast Nmap on $TARGET_URL..."
          HOST=$(echo $TARGET_URL | sed -n 's|^.*//\([^/:]*\).*|\1|p')
          echo "Target Host: $HOST"
          
          # -Pn: Skip ping, -T4: Aggressive, -p 80,443: Only web ports
          nmap -Pn -T4 -p 80,443 $HOST > nmap_results.txt 2>&1 || true
          
          echo "--- Nmap Results ---"
          cat nmap_results.txt
          echo "-------------------"
          
          echo "NMAP_RESULTS<<EOF" >> $GITHUB_ENV
          cat nmap_results.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Run Nuclei Scan (Robust)
        env:
          GOOGLE_API_KEY: "" 
        run: |
          echo "[+] Running Nuclei on $TARGET_URL..."
          # Added -ignore-unknown-protocols to handle filtered ports gracefully
          # Added -tech-detect to identify tech stack even if vulns aren't found
          nuclei -u $TARGET_URL -severity critical,high,medium -tags vuln,tech-detect -o nuclei_results.txt -ignore-unknown-protocols 2>&1 || true
          
          echo "--- Nuclei Results ---"
          cat nuclei_results.txt
          echo "----------------------"
          
          echo "NUCLEI_RESULTS<<EOF" >> $GITHUB_ENV
          cat nuclei_results.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Run SQLMap Scan (Optimized & Safe)
        run: |
          echo "[+] Running SQLMap on $TARGET_URL..."
          
          # Optimized flags:
          # --level=2: Faster (default is 1, 3 is very slow)
          # --risk=1: Less aggressive (default)
          # --crawl=1: Find more URLs quickly
          # --batch: Non-interactive
          # --timeout=30: Stop hanging requests faster
          
          # Use a temporary file to capture output safely
          SQLMAP_OUTPUT="/tmp/sqlmap_raw_output.txt"
          
          # Run with a 300s timeout, but capture exit code
          timeout 300 sqlmap -u "$TARGET_URL" --batch --level=2 --risk=1 --crawl=1 --timeout=30 --output-dir=/tmp/sqlmap_output > "$SQLMAP_OUTPUT" 2>&1 || true
          
          # Check if we got results
          if [ -s "$SQLMAP_OUTPUT" ]; then
            echo "--- SQLMap Results ---"
            cat "$SQLMAP_OUTPUT"
            echo "----------------------"
            
            echo "SQLMAP_RESULTS<<EOF" >> $GITHUB_ENV
            cat "$SQLMAP_OUTPUT" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          else
            echo "No SQLMap results found or scan timed out."
            echo "SQLMAP_RESULTS<<EOF" >> $GITHUB_ENV
            echo "Scan timed out or produced no output." >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          fi

      - name: Run AI Analysis
        run: |
          echo "[+] Sending combined findings to AI..."
          python ai_security_agent.py "$TARGET_URL"

      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: security-report-${{ github.run_id }}
          path: report_*.md
          retention-days: 1
